<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f1114">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Sonora-Einladung</title>
<style>
:root{--bg:#0f1114;--card:#181b20;--text:#f1f1f1;--muted:#9aa3ad;--accent:#8fd3b0;--on:#06120c;--line:#2b3038}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#1d2a25 0%,var(--bg) 60%);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px}
main{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 24px;text-align:center;box-shadow:0 20px 60px #0006}
.mark{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#4f8f9c);color:var(--on)}
.mark svg{width:34px;height:34px}
.kind{margin:0;color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
h1{margin:6px 0 8px;font-size:24px;line-height:1.25}
p{margin:0 0 20px;color:var(--muted);font-size:16px}
a.open,button{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:999px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
a.open{background:var(--accent);color:var(--on);border:0}
button{margin-top:10px;background:none;color:var(--text);border:1px solid var(--line);font-weight:600}
small{display:block;margin-top:18px;color:var(--muted);font-size:13px}
.status{min-height:20px;margin-top:10px;color:var(--accent);font-size:13px}
.bad .open,.bad button{display:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
</style>
</head>
<body>
<main id="card">
 <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
 <p class="kind" id="kind"></p>
 <h1 id="title"></h1>
 <p id="text"></p>
 <a class="open" id="open" href="#"></a>
 <button type="button" id="copy"></button>
 <div class="status" id="status" role="status"></div>
 <small id="hint"></small>
</main>
<script>
function renderInvite(){
 // The invitation sits after "#", so it is never sent to this web server. No tracking, no external files.
 var T={
  de:{title:'Du wurdest eingeladen',text:'Tippe auf den Knopf, um die Einladung in Sonora zu öffnen.',open:'In Sonora öffnen',copy:'Link kopieren',copied:'Kopiert. In Sonora unter Gemeinsam → Einladung öffnen einfügen.',hint:'Sonora noch nicht installiert? Frag die Person, die dir den Link geschickt hat, nach der App.',bad:'Dieser Link ist unvollständig',badText:'Bitte die Person, dir den Link noch einmal zu schicken.',f:'Freundeseinladung',r:'Hörraum',p:'Gemeinsame Playlist',s:'Playlist'},
  en:{title:'You have been invited',text:'Tap the button to open the invitation in Sonora.',open:'Open in Sonora',copy:'Copy link',copied:'Copied. Paste it in Sonora under Together → Open invitation.',hint:'Sonora not installed yet? Ask the person who sent you the link for the app.',bad:'This link is incomplete',badText:'Please ask the person to send you the link again.',f:'Friend invitation',r:'Listening room',p:'Shared playlist',s:'Playlist'},
  tr:{title:'Davet edildin',text:'Daveti Sonora’da açmak için düğmeye dokun.',open:'Sonora’da aç',copy:'Bağlantıyı kopyala',copied:'Kopyalandı. Sonora’da Birlikte → Daveti aç bölümüne yapıştır.',hint:'Sonora henüz yüklü değil mi? Bağlantıyı gönderen kişiden uygulamayı iste.',bad:'Bu bağlantı eksik',badText:'Lütfen bağlantıyı tekrar göndermesini iste.',f:'Arkadaş daveti',r:'Dinleme odası',p:'Ortak çalma listesi',s:'Çalma listesi'},
  th:{title:'คุณได้รับคำเชิญ',text:'แตะปุ่มเพื่อเปิดคำเชิญใน Sonora',open:'เปิดใน Sonora',copy:'คัดลอกลิงก์',copied:'คัดลอกแล้ว วางใน Sonora ที่ ด้วยกัน → เปิดคำเชิญ',hint:'ยังไม่ได้ติดตั้ง Sonora? ขอแอปจากผู้ที่ส่งลิงก์ให้คุณ',bad:'ลิงก์นี้ไม่สมบูรณ์',badText:'โปรดขอให้ส่งลิงก์ให้อีกครั้ง',f:'คำเชิญเป็นเพื่อน',r:'ห้องฟังเพลง',p:'เพลย์ลิสต์ที่แชร์',s:'เพลย์ลิสต์'}
 };
 var lang=(navigator.language||'de').slice(0,2).toLowerCase(),t=T[lang]||T.de,$=function(id){return document.getElementById(id)};
 document.documentElement.lang=T[lang]?lang:'de';
 var hash='';try{hash=decodeURIComponent(location.hash.slice(1))}catch(e){}var sn='SN-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}';
 var m=new RegExp('^(r|p|s|f)/'+sn+'$').exec(hash)||/^(room)\?code=sonora1\.[a-f0-9]{32}\.[a-f0-9]{32}$/.exec(hash)||/^(playlist)\?code=sonora2\.[a-f0-9]{32}\.[a-f0-9]{32}\.[a-f0-9]{32}$/.exec(hash);
 document.body.className='';$('kind').textContent='';$('status').textContent='';
 $('hint').textContent=t.hint;
 if(!m){document.body.className='bad';$('title').textContent=t.bad;$('text').textContent=t.badText;return}
 var kind={r:'r',room:'r',p:'p',playlist:'p',s:'s',f:'f'}[m[1]],app='sonora://join/'+hash;
 var android=/Android/i.test(navigator.userAgent),target=android?'intent://join/'+hash+'#Intent;scheme=sonora;package=app.sonora.player;end':app;
 $('kind').textContent=t[kind];$('title').textContent=t.title;$('text').textContent=t.text;
 var open=$('open');open.textContent=t.open;open.href=target;
 var copy=$('copy');copy.textContent=t.copy;
 copy.onclick=function(){var done=function(){$('status').textContent=t.copied};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(location.href).then(done,function(){prompt('',location.href)});else prompt('',location.href)};
 // External app launches require an explicit tap, including in Android browsers.
}
renderInvite();
window.addEventListener('hashchange',renderInvite);
</script>
</body>
</html>
